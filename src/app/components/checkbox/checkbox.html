<th scope="row" [attr.title]="description() || habitName()">
  <div class="habit">
    <lucide-icon
      class="size-5 shrink-0 text-blue-700 dark:text-blue-300"
      [img]="habitIcon()"
      aria-hidden="true"
    />
    <span>{{ habitName() }}</span>
  </div>
</th>
@for (day of weekDays; track day.name) {
  @let state = items()[day.storageIndex].state;
  <td>
    <button
      type="button"
      class="day-button"
      [attr.aria-label]="habitName() + ', ' + day.name + ', ' + states[state]"
      (click)="toggle(day.storageIndex)"
    >
      <span class="check-mark" [class.done]="state === 1" [class.missed]="state === 2">
        @if (state === 1) {
          <lucide-icon class="size-4" [img]="icons.Check" aria-hidden="true" />
        } @else if (state === 2) {
          <lucide-icon class="size-4" [img]="icons.X" aria-hidden="true" />
        }
      </span>
    </button>
  </td>
}
<td>
  <button
    type="button"
    class="reset-button"
    [attr.aria-label]="'Limpar marcações de ' + habitName()"
    [attr.title]="'Limpar marcações de ' + habitName()"
    (click)="reset()"
  >
    <lucide-icon class="size-4" [img]="icons.Trash2" aria-hidden="true" />
  </button>
</td>
