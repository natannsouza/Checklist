<th scope="row" [attr.title]="description() || habitName()">
  <div class="habit">
    <lucide-icon class="size-5 shrink-0 text-blue-300" [img]="habitIcon()" aria-hidden="true" />
    <span class="habit-name">{{ habitName() }}</span>
  </div>
</th>
@for (item of items(); track item.id; let i = $index) {
  <td>
    <button
      type="button"
      class="day-button"
      [attr.aria-label]="habitName() + ', ' + weekDays[i] + ', ' + states[item.state]"
      (click)="toggle(i)"
    >
      <span class="check-mark" [class.done]="item.state === 1" [class.missed]="item.state === 2">
        @if (item.state === 1) {
          <lucide-icon class="size-4" [img]="icons.Check" aria-hidden="true" />
        } @else if (item.state === 2) {
          <lucide-icon class="size-4" [img]="icons.X" aria-hidden="true" />
        }
      </span>
    </button>
  </td>
}
<td>
  <button
    type="button"
    class="reset-button"
    [attr.aria-label]="'Limpar marcações de ' + habitName()"
    [attr.title]="'Limpar marcações de ' + habitName()"
    (click)="reset()"
  >
    <lucide-icon class="size-4" [img]="icons.Trash2" aria-hidden="true" />
  </button>
</td>
