<div class="w-full space-y-3">
  <div class="grid grid-cols-8 not-even:gap-2 mx-2 p-2 rounded-sm">
    @for (array of items(); track array.id; let i = $index) {
      <label
        class="flex items-center p-2 bg-gray-50 hover:bg-gray-100 rounded-xl cursor-pointer transition-all group"
      >
        <p class="hidden">{{ storageKey() }}</p>
        <span (click)="toggle(i)" class="w-7 h-7 border-2 border-amber-300 rounded-sm">
          @if (array.state === 1) {
            <lucide-icon [img]="icons.Check" />
          }
          @if (array.state === 2) {
            <lucide-icon [img]="icons.X" />
          }
        </span>
      </label>
    }
    <div
      class="flex justify-center my-auto p-2 hover:bg-red-600 rounded-xl  transition-all group"
    >
      <button class="cursor-pointer" (click)="toggleNull()">
        <lucide-icon class=" w-4 h-4 md:w-6 md:h-6" [img]="icons.Trash2"></lucide-icon>
      </button>
    </div>
  </div>
</div>
