<div class="w-full space-y-3">
  <div class="grid grid-cols-8 gap-2 mx-2 p-2 rounded-sm items-stretch">
    @for (array of items(); track array.id; let i = $index) {
      <label
        class="flex items-center justify-center transition-all group cursor-pointer "
      >
        <p class="hidden">{{ storageKey() }}</p>
        <span
          (click)="toggle(i)"
          class="w-full aspect-square border-2 rounded-sm border-blue-900 flex items-center justify-center cursor-pointer hover:bg-zinc-700/90"
        >
          @if (array.state === 1) {
            <lucide-icon class="w-3 h-3 text-white md:w-5 md:h-5" [img]="icons.Check" />
          }
          @if (array.state === 2) {
            <lucide-icon class="w-3 h-3 text-white md:w-5 md:h-5" [img]="icons.X" />
          }
        </span>
      </label>
    }

    <div class="flex justify-center items-center p-1.5 md:p-2 transition-all group">
      <button class="cursor-pointer p-1 rounded-sm" (click)="toggleNull()">
        <lucide-icon
          class="w-4 h-4 md:w-6 md:h-6 text-white hover:text-black"
          [img]="icons.Trash2"
        ></lucide-icon>
      </button>
    </div>
  </div>
</div>
