<div
  class="w-full h-screen bg-linear-to-br from-slate-700 to-slate-800 flex items-center justify-center p-4"
>
  <!-- Quadrado centralizado -->
  <div
    id="box"
    class="w-full max-w-2xl max-h-screen bg-white rounded-2xl shadow-2xl p-8 flex flex-col justify-center items-center gap-6"
  >
    <!-- Título -->
    <div class="w-full text-center">
      <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2">Weekly Checks</h1>
    </div>

    <!-- Checkboxes -->
    <div class="w-full space-y-3">
      <div class="grid grid-cols-9 gap-2 mx-2 border border-slate-600 p-2 rounded-sm">
        <div class="flex justify-center my-auto mr-2">
          <lucide-icon class="w-6 h-6" [img]="icons.CodeXml"></lucide-icon>
        </div>
        @for (array of array(); track array.id; let i = $index) {
          <label
            class="flex items-center p-4 bg-gray-50 hover:bg-gray-100 rounded-xl cursor-pointer transition-all group"
          >
            <input
            (click)="toggle(i)"
              type="checkbox" storageKey="list_code" checked="array.state"
              name="code"
              class="w-6 h-6 text-cyan-600 bg-gray-100 border-gray-300 rounded-lg focus:ring-cyan-500 focus:ring-2 transition-all"
            />
          </label>
        }
        <div class="flex justify-center my-auto ">
          <lucide-icon class="w-6 h-6" [img]="icons.Trash2"></lucide-icon>
        </div>
      </div>

      <div class="grid grid-cols-9 gap-2 mx-2 border border-slate-600 p-2 rounded-sm">
        <div class="flex justify-center my-auto mr-2">
          <lucide-icon  class="w-6 h-6" [img]="icons.Book"></lucide-icon>
        </div>

        @for (array of array(); track array.id; let i = $index) {
          <label
            class="flex items-center p-4 bg-gray-50 hover:bg-gray-100 rounded-xl cursor-pointer transition-all group"
          >
            <input
            (click)="toggle(i)" 
              type="checkbox" storageKey="list_book"
              name="language"
              class="w-6 h-6 text-cyan-600 bg-gray-100 border-gray-300 rounded-lg focus:ring-cyan-500 focus:ring-2 transition-all"
            />
          </label>
        }
        <div class="flex justify-center my-auto ">
          <lucide-icon class="w-6 h-6" [img]="icons.Trash2"></lucide-icon>
        </div>
      </div>

      <div class="grid grid-cols-9 gap-2 mx-2 border border-slate-600 p-2 rounded-sm">
        <div class="flex justify-center my-auto mr-2">
          <lucide-icon [img]="icons.SquareActivity"></lucide-icon>
        </div>

        @for (array of array(); track array.id; let i = $index) {
          <label
            class="flex items-center p-4 bg-gray-50 hover:bg-gray-100 rounded-xl cursor-pointer transition-all group"
          >
            <input
            (click)="toggle(i)"
              type="checkbox" storageKey="list_exercise"
              name="language"
              class="w-6 h-6 text-cyan-600 bg-gray-100 border-gray-300 rounded-lg focus:ring-cyan-500 focus:ring-2 transition-all"
            />
          </label>
        }
        <div class="flex justify-center my-auto ">
          <lucide-icon class="w-6 h-6" [img]="icons.Trash2"></lucide-icon>
        </div>
      </div>
    </div>
  </div>
</div>
