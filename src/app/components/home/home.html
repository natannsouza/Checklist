<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weekly Checks</title>
  </head>
  <body>
    <div
      class="w-full min-h-screen flex flex-col md:flex-row bg-slate-900 bg-no-repeat bg-cover p-4 gap-6"
    >
      <!-- Left Box -->
      <div
        id="right-box"
        class="w-full md:flex-1 rounded-3xl p-6 md:p-8 flex flex-col items-center justify-start gap-8 pt-8 md:pt-10"
      >
        <!-- Relógio -->
        <div class="flex flex-col items-center gap-3">
          <span
            class="text-base md:text-[20px] font-semibold uppercase tracking-[0.3em] text-blue-400/60"
          >
            Horário
          </span>
          <div class="flex items-center gap-2">
            <span
              class="text-5xl md:text-6xl font-mono font-bold text-zinc-100 tabular-nums drop-shadow"
            >
              {{ data() | date: 'HH' }}
            </span>
            <span class="text-4xl md:text-5xl font-mono font-bold text-blue-700/50 mb-1">:</span>
            <span
              class="text-5xl md:text-6xl font-mono font-bold text-zinc-100 tabular-nums drop-shadow"
            >
              {{ data() | date: 'mm' }}
            </span>
            <span class="text-4xl md:text-5xl font-mono font-bold text-blue-700/50 mb-1">:</span>
            <span class="text-3xl md:text-4xl font-mono font-bold text-zinc-500/60">
              {{ data() | date: 'ss' }}
            </span>
          </div>
        </div>

        <app-microsoft-todo class="w-full min-w-0"></app-microsoft-todo>
      </div>
      <section
        aria-labelledby="weekly-checks-title"
        class="w-full min-w-0 md:flex-1 rounded-3xl border border-blue-900/60 bg-zinc-800/30 p-2.5 sm:p-5 flex flex-col justify-center"
      >
        <div class="weekly-checks w-full max-w-xl mx-auto">
          <h1
            id="weekly-checks-title"
            class="mb-5 px-2 text-2xl font-semibold tracking-tight text-zinc-100"
          >
            Checks da semana
          </h1>
          <table aria-labelledby="weekly-checks-title" class="weekly-grid">
            <colgroup>
              <col class="habit-column" />
              <col span="7" />
              <col class="reset-column" />
            </colgroup>
            <thead>
              <tr>
                <th scope="col"><span class="sr-only">Hábito</span></th>
                @for (day of weekDays; track day) {
                  <th scope="col" [attr.title]="day">
                    <span aria-hidden="true">{{ day[0] }}</span>
                    <span class="sr-only">{{ day }}</span>
                  </th>
                }
                <th scope="col"><span class="sr-only">Limpar linha</span></th>
              </tr>
            </thead>
            <tbody>
              @for (habit of habits; track habit.storageKey) {
                <tr
                  app-checkbox
                  [storageKey]="habit.storageKey"
                  [habitName]="habit.name"
                  [habitIcon]="habit.icon"
                  [description]="habit.description"
                ></tr>
              }
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </body>
</html>
