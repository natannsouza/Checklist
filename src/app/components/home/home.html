<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weekly Checks</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div
      class="w-full min-h-screen flex flex-col md:flex-row bg-slate-900 bg-no-repeat bg-cover p-4 gap-6"
    >
      <!-- Left Box -->
      <div
        id="right-box"
        class="w-full md:flex-1 rounded-3xl p-6 md:p-8 flex flex-col items-center justify-start gap-8 pt-8 md:pt-10"
      >
        <!-- Relógio -->
        <div class="flex flex-col items-center gap-3">
          <span
            class="text-base md:text-[20px] font-semibold uppercase tracking-[0.3em] text-blue-400/60"
          >
            Horário
          </span>
          <div class="flex items-center gap-2">
            <span
              class="text-5xl md:text-6xl font-mono font-bold text-zinc-100 tabular-nums drop-shadow"
            >
              {{ data() | date: 'HH' }}
            </span>
            <span class="text-4xl md:text-5xl font-mono font-bold text-blue-700/50 mb-1">:</span>
            <span
              class="text-5xl md:text-6xl font-mono font-bold text-zinc-100 tabular-nums drop-shadow"
            >
              {{ data() | date: 'mm' }}
            </span>
            <span class="text-4xl md:text-5xl font-mono font-bold text-blue-700/50 mb-1">:</span>
            <span class="text-3xl md:text-4xl font-mono font-bold text-zinc-500/60">
              {{ data() | date: 'ss' }}
            </span>
          </div>
        </div>

        <!-- Agenda -->
        <div class="w-full flex flex-col gap-3">
          <img src="/calen.png" class="w-10 h-10" />

          <!-- Card -->
          <div
            class="bg-zinc-800/85 rounded-2xl shadow-md border border-blue-900 p-4 flex flex-col gap-2"
          >
            <div
              class="flex items-center gap-3 hover:bg-zinc-700/50 transition-all rounded-xl px-3 py-3 cursor-pointer"
            >
              <div class="w-2.5 h-2.5 rounded-full bg-blue-600 shrink-0"></div>
              <span class="text-sm font-medium text-zinc-200">Estudos</span>
            </div>
            <div
              class="flex items-center gap-3 hover:bg-zinc-700/50 transition-all rounded-xl px-3 py-3 cursor-pointer"
            >
              <div class="w-2.5 h-2.5 rounded-full bg-blue-600 shrink-0"></div>
              <span class="text-sm font-medium text-zinc-200">Faculdade</span>
            </div>
          </div>
        </div>
      </div>
      <!-- Right Box -->
      <div
        id="left-box"
        class="w-full md:flex-1 bg-zinc-800/30 backdrop-blur-md rounded-3xl shadow-2xl border border-blue-900/60 p-4 flex flex-col justify-center items-center gap-6"
      >
        <div class="w-full max-w-sm mx-2">
          <div class="w-full text-center">
            <h1 class="text-3xl md:text-4xl font-bold text-zinc-100 tracking-tight mb-2">
              Weekly Checks
            </h1>
          </div>
          
          <div>
            <div
              class="flex items-center bg-zinc-800/70 transition-all border border-blue-900 rounded-2xl shadow-sm p-2 my-4"
            >
              <lucide-icon
                class="w-6 h-6 mx-2 text-white shrink-0"
                [img]="icons.CodeXml"
              ></lucide-icon>
              <app-checkbox [storageKey]="'CodeXml'"></app-checkbox>
            </div>
          </div>
          <div>
            <div
              class="flex items-center bg-zinc-800/70 transition-all border border-blue-800 rounded-2xl shadow-sm p-2 my-4"
            >
              <lucide-icon
                class="w-6 h-6 mx-2 text-white shrink-0"
                [img]="icons.Bitcoin"
              ></lucide-icon>
              <app-checkbox [storageKey]="'Bitcoin'"></app-checkbox>
            </div>
          </div>
          <div>
            <div
              class="flex items-center bg-zinc-800/70 transition-all border border-blue-800 rounded-2xl shadow-sm p-2 my-4"
            >
              <lucide-icon
                class="w-6 h-6 mx-2 text-white shrink-0"
                [img]="icons.University"
              ></lucide-icon>
              <app-checkbox [storageKey]="'University'"></app-checkbox>
            </div>
          </div>
          <div>
            <div
              class="flex items-center bg-zinc-800/70 transition-all border border-blue-800 rounded-2xl shadow-sm p-2 my-4"
            >
              <lucide-icon
                class="w-6 h-6 mx-2 text-white shrink-0"
                [img]="icons.Dumbbell"
              ></lucide-icon>
              <app-checkbox [storageKey]="'SquareActivity'"></app-checkbox>
            </div>
          </div>
          <div>
            <div
              class="flex items-center bg-zinc-800/70 transition-all border border-blue-800 rounded-2xl shadow-sm p-2 my-4"
            >
              <lucide-icon
                class="w-6 h-6 mx-2 text-white shrink-0"
                [img]="icons.Languages"
              ></lucide-icon>
              <app-checkbox [storageKey]="'Languages'"></app-checkbox>
            </div>
          </div>
          <div>
            <div
              class="flex items-center bg-zinc-800/70 transition-all border border-blue-800 rounded-2xl shadow-sm p-2 my-4"
            >
              <lucide-icon
                class="w-6 h-6 mx-2 text-white shrink-0"
                [img]="icons.Book"
              ></lucide-icon>
              <app-checkbox [storageKey]="'Book'"></app-checkbox>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
